<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
<h1>회원가입</h1>
<!--
@PostMapping("/api/signup")
public String 회원가입하기(){}
Controller 에서 위와 같이 post 형태로 /api/signup 이라는 주소로
데이터 저장하기 를 작성하였고
html 내에서는
5가지 방법으로 소비자가 작성한 회원가입 데이터를
DB에 저장할 수 있다.
그 중 하나가 아래 방법

이외 button id 또는 onclick / onsubmit / form id 와 같은 방법 존재
1. form action 의 경우에는 아이디 비밀번호 이메일 중 소비자가
   회사가 원하는 방식대로 작성하지 않아도 막을 방법이 많지 않다.
   백엔드에서 다시 쓰세요 반환과 같은 처리를 하면 소비자가
   더 불편함을 느낀다.

2. id 로 자바스크립트 연결하여 코딩하는 로직이 불편해
    onclick 이나 onsubmit 처럼 자바스크립트에서 어느정도 완성된 기능을
    html 에서 사용했지만 하나의 요소에서 수많은 작업을 해야할 때는
    on 기능이 오히려 번잡하게 느껴진다.

3. 돌고 돌아 결국에는 id 형태로 기능을 사용하게 됨
    react 나  typescript 의 경우 id 형태로
    데이터 처리를 프론트엔드에서 많이 한다.
-->
<main>의 html 자체에서 어느정도 css 를 추가한 태그</main>
<div>display:block 의 css만 들어있는 깨끗한 태그가 더 개발하기 편하다</div>
<form action="/api/signup" method="post">
    <!--
    private String member_username; // 아이디
    private String member_password; // 비밀번호
    private String member_email;
    더 큰 고생하고 싶지 않으면
    entity에 작성한 변수이름과
    <input 태그 내 작성한 name 속성명칭과
    동일하게 작성해주고 추가적으로 javaScript 에서 custom 할 일 이 존재한다면
    다르게 표기해도 된다.
    entity 에작성한 변수이름과 input 에 작성하는 순서는 달라도 상관 없다.

    회원가입 / 유저 조회
    자바스크립트로 회원가입 저장
    회사에서 프론트엔드 백엔드가 나누어져 있으면
    자바스크립트로 회원가입을 하는 형태를 많이 사용
    ajax fetch promise sql postgre
     -->
    아이디 : <input type="text" name="member_username"><br>
    이메일 : <input type="text" name="member_email"><br>
    비밀번호 : <input type="text" name="member_password"><br>
    <!-- 만약에
    아이디에 한글이 있으면 어떻게 해?
    비밀번호에 대소문자특수문자숫자를 모두 하나씩 넣었으면 좋겠는데
    없으면 어떻게해 ?

    form  action="/api/signup"  을 사용하기 보다는
    다음주부터는 button type="button" id="회원가입기능"
    과 같이 표기
    -->
</form>
</body>
</html>
