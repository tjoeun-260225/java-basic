<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원가입 | Spring Community</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <div class="text-center mb-5">

                        <h2 class="fw-bold text-primary">
                            ✨ 회원가입
                        </h2>

                        <p class="text-muted">
                            Spring Community 회원이 되어 다양한 서비스를 이용해보세요.
                        </p>

                    </div>

                    <form action="/signup"
                          method="post"
                          enctype="multipart/form-data">

                        <!-- 아이디 -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                아이디
                            </label>

                            <input
                                    type="text"
                                    name="id"
                                    class="form-control form-control-lg"
                                    placeholder="아이디를 입력하세요"
                                    required>

                        </div>

                        <!-- 이메일 -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                이메일
                            </label>

                            <div class="input-group">

                                <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        class="form-control"
                                        placeholder="example@email.com"
                                        required>

                                <button
                                        class="btn btn-primary"
                                        type="button"
                                        onclick="sendEmailCode()">

                                    인증번호 발송

                                </button>

                            </div>

                        </div>

                        <!-- 인증번호 -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                인증번호
                            </label>

                            <div class="input-group">

                                <input
                                        type="text"
                                        id="code"
                                        class="form-control"
                                        placeholder="인증번호 입력">

                                <button
                                        class="btn btn-success"
                                        type="button"
                                        onclick="verifyEmailCode()">

                                    확인

                                </button>

                            </div>

                            <small
                                    id="verifyResult"
                                    class="fw-bold mt-2 d-block">
                            </small>

                        </div>

                        <!-- 이름 -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                이름
                            </label>

                            <input
                                    type="text"
                                    name="name"
                                    class="form-control form-control-lg"
                                    placeholder="이름을 입력하세요"
                                    required>

                        </div>

                        <!-- 비밀번호 -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                비밀번호
                            </label>

                            <input
                                    type="password"
                                    name="password"
                                    class="form-control form-control-lg"
                                    placeholder="비밀번호를 입력하세요"
                                    required>

                        </div>

                        <!-- 프로필 이미지 -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                프로필 이미지
                            </label>

                            <input
                                    type="file"
                                    name="profileImg"
                                    accept="image/*"
                                    class="form-control">

                        </div>

                        <!-- 버튼 -->
                        <div class="d-grid gap-2">

                            <button
                                    type="submit"
                                    class="btn btn-success btn-lg">

                                회원가입

                            </button>

                            <button
                                    type="reset"
                                    class="btn btn-outline-secondary">

                                초기화

                            </button>

                        </div>

                    </form>

                    <hr class="my-4">

                    <div class="text-center">

                        <p class="mb-2">
                            이미 회원이신가요?
                        </p>

                        <a th:href="@{/login}"
                           class="btn btn-primary">

                            로그인

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script>

    function sendEmailCode() {

        const email = document.getElementById("email").value;

        if(email.trim() === ""){

            alert("이메일을 입력해주세요.");
            return;
        }

        fetch("/email/send?email=" + encodeURIComponent(email), {

            method:"POST"

        })

            .then(res=>res.text())

            .then(msg=>{

                alert(msg);

            })

            .catch(()=>{

                alert("인증번호 발송에 실패했습니다.");

            });

    }

    function verifyEmailCode(){

        const email=document.getElementById("email").value;

        const code=document.getElementById("code").value;

        fetch("/email/verify?email="

            + encodeURIComponent(email)

            + "&code="

            + encodeURIComponent(code),

            {

                method:"POST"

            })

            .then(res=>res.text())

            .then(msg=>{

                const result=document.getElementById("verifyResult");

                result.innerText=msg;

                if(msg.includes("성공")){

                    result.className="text-success fw-bold mt-2 d-block";

                }else{

                    result.className="text-danger fw-bold mt-2 d-block";

                }

            })

            .catch(()=>{

                alert("인증 확인 중 오류가 발생했습니다.");

            });

    }

</script>

</body>

</html>
