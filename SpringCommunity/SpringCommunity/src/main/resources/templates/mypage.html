<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>마이페이지 | Spring Community</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0 rounded-4">

                <!-- 카드 상단 -->
                <div class="bg-primary text-white text-center p-5 rounded-top-4">

                    <img
                            th:if="${session.loginMember.profileImage != null}"
                            th:src="@{'/uploads/' + ${session.loginMember.profileImage}}"
                            class="rounded-circle border border-4 border-white shadow"
                            width="160"
                            height="160"
                            style="object-fit:cover;">

                    <!-- 프로필 이미지가 없을 경우 -->
                    <img
                            th:unless="${session.loginMember.profileImage != null}"
                            src="https://via.placeholder.com/160"
                            class="rounded-circle border border-4 border-white shadow">

                    <h2 class="mt-3 fw-bold"
                        th:text="${session.loginMember.name}">
                    </h2>

                    <p class="mb-0"
                       th:text="${session.loginMember.email}">
                    </p>

                </div>

                <!-- 회원정보 -->
                <div class="card-body p-5">

                    <h4 class="mb-4 text-primary">
                        👤 회원 정보
                    </h4>

                    <table class="table table-bordered align-middle">

                        <tbody>

                        <tr>

                            <th class="table-light" width="25%">
                                아이디
                            </th>

                            <td th:text="${session.loginMember.id}">
                            </td>

                        </tr>

                        <tr>

                            <th class="table-light">
                                이름
                            </th>

                            <td th:text="${session.loginMember.name}">
                            </td>

                        </tr>

                        <tr>

                            <th class="table-light">
                                이메일
                            </th>

                            <td th:text="${session.loginMember.email}">
                            </td>

                        </tr>

                        </tbody>

                    </table>

                    <!-- 버튼 -->
                    <div class="text-center mt-5">

                        <a th:href="@{/}"
                           class="btn btn-primary me-2">

                            🏠 메인으로

                        </a>

                        <a th:href="@{/logout}"
                           class="btn btn-danger">

                            🚪 로그아웃

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
