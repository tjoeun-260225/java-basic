  servlet:
    multipart:
      max-file-size: 5MB # 1개 파일 업로드 가능한 최대 크기
      max-request-size: 5MB # 모든 파일의 크기가 총 5MB까지만 가능
      # 프론트엔드에서 백엔드로 데이터를 넘기고,
      # 백엔드에서 프론트엔드로 전달받은 데이터를 저장할 때
      # 한 파일당 회사에서 업로드 가능하도록 지정한 크기까지만 허용 제한
      # 전체 파일 또한 업로드 가능하도록 지정한 크기까지만 허용 제한
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
server:
